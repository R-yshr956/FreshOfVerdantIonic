<ion-app>
  <ion-menu menuId="main-menu" contentId="main-content" [disabled]="!showMenu">
    <ion-content>
      <div class="menu-head" routerLink="/profile">
        <!-- Avatar placeholder: replace with <img> later -->
        <div class="avatar img-ph">{{ profileInitials }}<ion-icon name="chevron-forward"></ion-icon></div>
        <h2>{{ profileName }}</h2>
        <p><ion-icon name="call-outline"></ion-icon> {{ profilePhone }}</p>
      </div>

      <nav class="menu-list">
        @for (group of menuGroups; track group.title) {
          <section class="menu-section">
            <h3 class="menu-group">{{ group.title }}</h3>
            @for (item of group.items; track item.url + item.title) {
              <ion-menu-toggle [autoHide]="false"><a class="menu-item" [routerLink]="item.url" [class.active]="isMenuItemActive(item.url)"><ion-icon [name]="item.icon"></ion-icon><span>{{ item.title }}</span>@if (item.badge && cart.count() > 0) { <em class="count">{{ cart.count() }}</em> }</a></ion-menu-toggle>
            }
          </section>
        }
      </nav>

      <div class="menu-foot">
        <ion-menu-toggle [autoHide]="false">
          <button class="logout" (click)="logout()">
            <ion-icon name="log-out-outline"></ion-icon> Logout
          </button>
        </ion-menu-toggle>
        <small>FRESH MARKET • VERSION 2.4.0</small>
      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
