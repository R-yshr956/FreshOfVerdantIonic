<ion-header class="ion-no-border">
  <ion-toolbar class="fv-toolbar" [class.brand-toolbar]="brandMode">
    <ion-buttons slot="start">
      <button class="menu-btn" type="button" aria-label="Open navigation menu" (click)="openMenu()"><ion-icon name="menu-outline"></ion-icon></button>
    </ion-buttons>

    @if (brandMode) {
      <div class="brand-title"><img class="official-logo" src="https://cdn.phototourl.com/member/2026-10-22-e0d176fe-0763-46fd-be92-ddac142cb10f.png" alt="Fresh of Verdant logo"><strong>{{ title }}</strong></div>
    } @else {
      <div class="titles"><small>{{ subtitle }}</small><strong>{{ title }}</strong></div>
    }

    <a slot="end" class="cart-btn" routerLink="/cart">
      <ion-icon name="cart-outline"></ion-icon>
      @if (auth.isAuthenticated && cart.count() > 0) {
        <span class="badge">{{ cart.count() }}</span>
      }
    </a>
  </ion-toolbar>
</ion-header>
