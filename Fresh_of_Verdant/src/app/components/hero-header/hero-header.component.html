<ion-header class="ion-no-border">
  <ion-toolbar class="hero" [class.text-black]="textBlack">
    <div class="row" [class.text-black]="textBlack">
      <button class="menu-btn" type="button" aria-label="Open navigation menu" (click)="openMenu()"><ion-icon name="menu-outline"></ion-icon></button>
      <div class="texts">
        <small>{{ eyebrow }}</small>
        <h1>{{ title }}</h1>
        @if (subtitle) { <p>{{ subtitle }}</p> }
      </div>
      @if (rightIcon) {
        <span class="icon-box"><ion-icon [name]="rightIcon"></ion-icon></span>
      }
    </div>
  </ion-toolbar>
</ion-header>
